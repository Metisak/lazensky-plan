<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plán" />
    <meta
      name="description"
      content="Denní přehled lázeňských procedur — Lázeňský plán"
    />
    <title>Lázeňský plán</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>

    <header class="topbar">
      <button type="button" class="nav-btn" id="btn-prev" aria-label="Předchozí">
        ‹
      </button>
      <div class="topbar-center">
        <h1 class="app-title">Lázeňský plán</h1>
        <p class="period-title" id="period-title"></p>
      </div>
      <button type="button" class="nav-btn" id="btn-next" aria-label="Další">
        ›
      </button>
    </header>

    <div class="today-row">
      <button type="button" class="today-btn" id="btn-today">Dnes</button>
    </div>

    <section class="meals" aria-label="Časy jídel">
      <div class="meal">
        <span class="meal-name">Snídaně</span>
        <span class="meal-time">7–8</span>
      </div>
      <div class="meal">
        <span class="meal-name">Oběd</span>
        <span class="meal-time">11:30–12</span>
      </div>
      <div class="meal">
        <span class="meal-name">Večeře</span>
        <span class="meal-time">17–17:30</span>
      </div>
    </section>

    <main class="view" id="view"></main>

    <div class="toast" id="toast" hidden>Your treatment awaits.</div>

    <nav class="tabbar" aria-label="Pohledy">
      <button type="button" class="tab" data-view="day" aria-current="page">
        <span class="tab-icon" aria-hidden="true">▣</span>
        Den
      </button>
      <button type="button" class="tab" data-view="week">
        <span class="tab-icon" aria-hidden="true">☰</span>
        Týden
      </button>
      <button type="button" class="tab" data-view="month">
        <span class="tab-icon" aria-hidden="true">▦</span>
        Měsíc
      </button>
    </nav>

    <script src="./app.js?v=4" defer></script>
  </body>
</html>
